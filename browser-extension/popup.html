<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omnikey Password Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="extension-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-title">Omnikey</span>
          <span class="brand-subtitle">Smart Autofill</span>
        </div>
      </div>
      <div id="header-actions" class="header-actions hidden">
        <button id="btn-refresh" class="icon-btn" title="Sync Vault">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 4v6h-6"></path>
            <path d="M1 20v-6h6"></path>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>
        <button id="btn-lock" class="icon-btn danger" title="Lock Vault">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Global Toast Feedback Banner -->
    <div id="toast" class="toast hidden"></div>

    <!-- Active Domain Detection Banner -->
    <div class="detected-domain-bar">
      <div class="domain-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
        <span id="detected-hostname">Detecting domain...</span>
      </div>
      <span id="domain-security-tag" class="security-tag">Protected Domain</span>
    </div>

    <!-- POPUP STATE 1: VAULT LOCKED (ONLY MASTER PASSWORD PROMPT) -->
    <main id="state-locked" class="view">
      <div class="glass-card">
        <div class="shield-avatar">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
        </div>
        <h2>Unlock Omnikey</h2>
        <p class="card-subtitle">Enter Master Password to access stored credentials.</p>

        <form id="form-unlock" class="login-form">
          <!-- Master Password Input Field ONLY -->
          <div class="form-group">
            <label for="input-master-password">Master Password</label>
            <div class="input-wrapper">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <input type="password" id="input-master-password" placeholder="Enter Master Password" required autocomplete="current-password" autofocus>
              <button type="button" id="btn-toggle-password" class="input-action-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-group settings-accordion">
            <button type="button" id="btn-toggle-settings" class="settings-toggle">
              <span>API Connection Settings</span>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
            <div id="settings-content" class="settings-content hidden">
              <label for="input-api-url">Omnikey API Server</label>
              <input type="url" id="input-api-url" value="http://localhost:8080/api">
            </div>
          </div>

          <button type="submit" id="btn-unlock-submit" class="btn btn-primary">
            <span class="btn-text">⚡ Unlock Vault</span>
            <span class="btn-spinner hidden"></span>
          </button>
        </form>
      </div>
    </main>

    <!-- POPUP STATE 2 & 3 & 4 & 5: UNLOCKED VAULT VIEWS -->
    <main id="state-unlocked" class="view hidden">
      <!-- Section: Matching Credentials for Active Domain -->
      <section class="vault-section">
        <div class="section-header">
          <h3 id="matching-section-title">Matching Credentials</h3>
          <span id="matches-badge" class="count-pill">0</span>
        </div>
        <div id="matching-credentials-container" class="credentials-list">
          <!-- Dynamically filled with matching credential cards -->
        </div>
      </section>

      <!-- Section: All Stored Vault Credentials -->
      <section class="vault-section">
        <div class="section-header">
          <h3>All Saved Vault Items</h3>
        </div>
        <div class="search-box">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="input-search" placeholder="Search saved passwords...">
        </div>
        <div id="all-credentials-container" class="credentials-list scrollable">
          <!-- Dynamically filled with all vault items -->
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <span id="user-status-display" class="user-display">Secure Connection Active</span>
      <span class="version-tag">v1.0.0</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
